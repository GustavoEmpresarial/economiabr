<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - AutoBlog</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #06080a;
        color: #f0f0f0;
        padding: 20px;
      }
      .container { max-width: 1200px; margin: 0 auto; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        border-bottom: 2px solid #d91812;
        padding-bottom: 15px;
      }
      h1 { color: #d91812; font-size: 28px; }
      .logout { background: #d91812; color: #fff; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
      .logout:hover { background: #b91410; }
      
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      button {
        background: #d91812;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 14px;
      }
      button:hover { background: #b91410; }
      button.danger { background: #c41e3a; }
      button.danger:hover { background: #a01a2e; }
      
      .search-box {
        flex: 1;
        min-width: 200px;
        padding: 10px;
        background: #1a1d23;
        border: 1px solid #333;
        color: #f0f0f0;
        border-radius: 4px;
      }
      
      .posts-list {
        display: grid;
        gap: 15px;
      }
      .post-card {
        background: #1a1d23;
        border-left: 4px solid #d91812;
        padding: 15px;
        border-radius: 4px;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 15px;
        align-items: center;
      }
      .post-info h3 {
        color: #d91812;
        margin-bottom: 5px;
        word-break: break-word;
      }
      .post-info p {
        font-size: 12px;
        color: #999;
        margin-bottom: 5px;
      }
      .post-info .excerpt {
        color: #ccc;
        font-size: 13px;
        line-height: 1.4;
      }
      .post-actions {
        display: flex;
        gap: 8px;
      }
      .post-actions button {
        padding: 6px 12px;
        font-size: 12px;
      }
      
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.7);
        z-index: 999;
        align-items: center;
        justify-content: center;
      }
      .modal.active { display: flex; }
      .modal-content {
        background: #1a1d23;
        padding: 30px;
        border-radius: 8px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        border: 1px solid #333;
      }
      .modal-content h2 {
        color: #d91812;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 10px;
        background: #06080a;
        border: 1px solid #333;
        color: #f0f0f0;
        border-radius: 4px;
        font-family: inherit;
      }
      .form-group textarea {
        min-height: 200px;
        resize: vertical;
      }
      .modal-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      .modal-buttons button {
        padding: 10px 20px;
      }
      .modal-buttons .cancel {
        background: #333;
      }
      .modal-buttons .cancel:hover { background: #444; }
      
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: #999;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #999;
      }
      .error {
        background: #c41e3a;
        color: white;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .success {
        background: #0ba85b;
        color: white;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      
      @media (max-width: 768px) {
        .post-card {
          grid-template-columns: 1fr;
        }
        .post-actions {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📝 Admin - AutoBlog</h1>
        <button class="logout" onclick="logout()">Sair</button>
      </header>

      <div id="message"></div>

      <div class="controls">
        <input
          type="text"
          class="search-box"
          id="searchBox"
          placeholder="Buscar posts..."
          onkeyup="filterPosts()"
        />
        <button onclick="openCreateModal()">➕ Novo Post</button>
        <button class="danger" onclick="deleteAllPosts()">🗑️ Deletar Tudo</button>
      </div>

      <div id="postsList" class="posts-list">
        <div class="loading">Carregando posts...</div>
      </div>
    </div>

    <div id="editModal" class="modal">
      <div class="modal-content">
        <h2>Editar Post</h2>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="editTitle" />
        </div>
        <div class="form-group">
          <label>Resumo</label>
          <textarea id="editExcerpt"></textarea>
        </div>
        <div class="form-group">
          <label>Conteúdo (Markdown)</label>
          <textarea id="editContent"></textarea>
        </div>
        <div class="form-group">
          <label>URL da Imagem</label>
          <input type="text" id="editImageUrl" />
        </div>
        <div class="modal-buttons">
          <button class="cancel" onclick="closeEditModal()">Cancelar</button>
          <button onclick="savePost()">Salvar</button>
        </div>
      </div>
    </div>

    <div id="createModal" class="modal">
      <div class="modal-content">
        <h2>Novo Post</h2>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="newTitle" />
        </div>
        <div class="form-group">
          <label>Resumo</label>
          <textarea id="newExcerpt"></textarea>
        </div>
        <div class="form-group">
          <label>Conteúdo (Markdown)</label>
          <textarea id="newContent"></textarea>
        </div>
        <div class="form-group">
          <label>URL da Imagem</label>
          <input type="text" id="newImageUrl" />
        </div>
        <div class="form-group">
          <label>Tags (separadas por vírgula)</label>
          <input type="text" id="newTags" />
        </div>
        <div class="modal-buttons">
          <button class="cancel" onclick="closeCreateModal()">Cancelar</button>
          <button onclick="createPost()">Publicar</button>
        </div>
      </div>
    </div>

    <script>
      const API_SECRET = prompt("Digite o API_SECRET:") || "";
      let currentEditSlug = null;
      let allPosts = [];

      async function loadPosts() {
        try {
          const response = await fetch("/api/posts?limit=100");
          const data = await response.json();
          allPosts = data.posts || [];
          renderPosts(allPosts);
        } catch (error) {
          showMessage("Erro ao carregar posts", "error");
          console.error(error);
        }
      }

      function renderPosts(posts) {
        const container = document.getElementById("postsList");
        if (posts.length === 0) {
          container.innerHTML = '<div class="empty">Nenhum post encontrado</div>';
          return;
        }

        container.innerHTML = posts
          .map(
            (post) => `
          <div class="post-card">
            <div class="post-info">
              <h3>${escapeHtml(post.title)}</h3>
              <p>${new Date(post.published_at).toLocaleString("pt-BR")}</p>
              <p class="excerpt">${escapeHtml(post.excerpt || "")}</p>
            </div>
            <div class="post-actions">
              <button onclick="openEditModal('${post.slug}')">✏️ Editar</button>
            </div>
            <div class="post-actions">
              <button class="danger" onclick="deletePost('${post.slug}')">🗑️ Deletar</button>
            </div>
          </div>
        `
          )
          .join("");
      }

      function filterPosts() {
        const query = document.getElementById("searchBox").value.toLowerCase();
        const filtered = allPosts.filter(
          (p) =>
            p.title.toLowerCase().includes(query) ||
            p.excerpt.toLowerCase().includes(query)
        );
        renderPosts(filtered);
      }

      function openCreateModal() {
        document.getElementById("createModal").classList.add("active");
      }

      function closeCreateModal() {
        document.getElementById("createModal").classList.remove("active");
        document.getElementById("newTitle").value = "";
        document.getElementById("newExcerpt").value = "";
        document.getElementById("newContent").value = "";
        document.getElementById("newImageUrl").value = "";
        document.getElementById("newTags").value = "";
      }

      async function createPost() {
        const title = document.getElementById("newTitle").value.trim();
        const excerpt = document.getElementById("newExcerpt").value.trim();
        const contentMarkdown = document.getElementById("newContent").value.trim();
        const imageUrl = document.getElementById("newImageUrl").value.trim();
        const tags = document.getElementById("newTags").value.split(",").map((t) => t.trim());

        if (!title || !contentMarkdown) {
          showMessage("Título e Conteúdo são obrigatórios", "error");
          return;
        }

        try {
          const response = await fetch("/api/posts", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-secret": API_SECRET,
            },
            body: JSON.stringify({
              title,
              excerpt,
              contentMarkdown,
              imageUrl: imageUrl || undefined,
              tags,
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Erro ao criar post");
          }

          showMessage("Post criado com sucesso!", "success");
          closeCreateModal();
          loadPosts();
        } catch (error) {
          showMessage("Erro ao criar post: " + error.message, "error");
        }
      }

      async function openEditModal(slug) {
        currentEditSlug = slug;
        try {
          const response = await fetch(`/api/posts/${slug}`);
          const data = await response.json();
          const post = data.post;

          document.getElementById("editTitle").value = post.title;
          document.getElementById("editExcerpt").value = post.excerpt || "";
          document.getElementById("editContent").value = post.content_markdown || "";
          document.getElementById("editImageUrl").value = post.image_url || "";

          document.getElementById("editModal").classList.add("active");
        } catch (error) {
          showMessage("Erro ao carregar post", "error");
        }
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.remove("active");
        currentEditSlug = null;
      }

      async function savePost() {
        if (!currentEditSlug) return;

        const title = document.getElementById("editTitle").value.trim();
        const excerpt = document.getElementById("editExcerpt").value.trim();
        const contentMarkdown = document.getElementById("editContent").value.trim();
        const imageUrl = document.getElementById("editImageUrl").value.trim();

        if (!title || !contentMarkdown) {
          showMessage("Título e Conteúdo são obrigatórios", "error");
          return;
        }

        try {
          const response = await fetch(`/api/posts/${currentEditSlug}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "x-api-secret": API_SECRET,
            },
            body: JSON.stringify({
              title,
              excerpt,
              contentMarkdown,
              imageUrl: imageUrl || undefined,
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Erro ao salvar post");
          }

          showMessage("Post atualizado com sucesso!", "success");
          closeEditModal();
          loadPosts();
        } catch (error) {
          showMessage("Erro ao salvar: " + error.message, "error");
        }
      }

      async function deletePost(slug) {
        if (!confirm("Tem certeza que deseja deletar este post?")) return;

        try {
          const response = await fetch(`/api/posts/${slug}`, {
            method: "DELETE",
            headers: {
              "x-api-secret": API_SECRET,
            },
          });

          if (!response.ok) {
            throw new Error("Erro ao deletar post");
          }

          showMessage("Post deletado com sucesso!", "success");
          loadPosts();
        } catch (error) {
          showMessage("Erro ao deletar: " + error.message, "error");
        }
      }

      async function deleteAllPosts() {
        if (!confirm("Tem CERTEZA que deseja deletar TODOS os posts? Esta ação não pode ser desfeita!"))
          return;

        try {
          const response = await fetch("/api/posts/admin/delete-all", {
            method: "DELETE",
            headers: {
              "x-api-secret": API_SECRET,
            },
          });

          if (!response.ok) {
            throw new Error("Erro ao deletar todos os posts");
          }

          showMessage("Todos os posts foram deletados!", "success");
          loadPosts();
        } catch (error) {
          showMessage("Erro: " + error.message, "error");
        }
      }

      function logout() {
        sessionStorage.clear();
        window.location.href = "/";
      }

      function showMessage(text, type) {
        const container = document.getElementById("message");
        container.innerHTML = `<div class="${type}">${escapeHtml(text)}</div>`;
        setTimeout(() => {
          container.innerHTML = "";
        }, 5000);
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Validar acesso
      if (!API_SECRET) {
        alert("API_SECRET é obrigatório para acessar admin");
        window.location.href = "/";
      }

      // Carregar posts ao abrir
      loadPosts();
    </script>
  </body>
</html>
