services:
  autoblog:
    build: .
    container_name: autoblog
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: autoblog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoblog}
      POSTGRES_USER: ${POSTGRES_USER:-autoblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - autoblog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoblog} -d ${POSTGRES_DB:-autoblog}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  autoblog-db-data:
