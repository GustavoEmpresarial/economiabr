<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Economia BR | Artigo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="container nav-shell">
        <div class="header-left">
          <a href="/" class="menu-trigger link-reset" aria-label="Abrir menu">
            <span class="menu-icon" aria-hidden="true"></span>
            <span>MENU</span>
          </a>
          <nav class="nav-links" aria-label="Navegacao principal">
            <a href="/" class="link-reset">INICIO</a>
            <a href="/#mais-noticias" class="link-reset accent-green">GRAFICOS</a>
          </nav>
        </div>

        <a href="/" class="logo link-reset">ECONOMIA BR</a>

        <div class="header-right">
          <button class="search-btn" type="button" aria-label="Buscar">
            <span class="search-lens" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="container article-layout dark-article">
      <article>
        <span class="category-tag">NOTICIA</span>
        <h1 id="post-title" class="article-title">Carregando...</h1>
        <p id="post-meta" class="article-meta"></p>
        <img id="post-image" class="article-image hidden" alt="Imagem do artigo" />
        <div id="post-content" class="article-content"></div>
      </article>
    </main>

    <script src="/post.js"></script>
  </body>
</html>
